name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint release-critical social room files
        run: >-
          npx eslint
          app/api/games/all-about-you/[code]/photo/route.ts
          app/api/games/social-room-control/route.ts
          app/games/all-about-you/GuestHonorPhoto.tsx
          app/games/all-about-you/AllAboutYouClient.tsx
          proxy.ts
          tests/social-room-readiness.test.ts

      - name: Full lint baseline audit
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Responsive and accessibility tests
        run: npm run test:e2e

      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
