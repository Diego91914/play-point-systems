name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  event-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: event_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AMPLIFIED_EVENT_TEST_DATABASE_URL: postgresql://postgres:event_test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify event lifecycle transactions on PostgreSQL
        run: npx vitest run tests/play-amplified-event-transactions.test.ts

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint release-critical social room files
        run: >-
          npx eslint
          app/api/games/all-about-you/[code]/photo/route.ts
          app/api/games/social-room-control/route.ts
          app/games/all-about-you/GuestHonorPhoto.tsx
          app/games/all-about-you/AllAboutYouClient.tsx
          proxy.ts
          tests/social-room-readiness.test.ts

      - name: Full lint baseline audit
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Responsive and accessibility tests
        run: npm run test:e2e

      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
