name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Lint release-critical social room files
        run: >-
          npx eslint
          app/api/games/all-about-you/[code]/photo/route.ts
          app/api/games/social-room-control/route.ts
          app/games/all-about-you/GuestHonorPhoto.tsx
          app/games/all-about-you/AllAboutYouClient.tsx
          proxy.ts
          tests/social-room-readiness.test.ts

      - name: Full lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Responsive and accessibility tests
        run: npm run test:e2e -- --project=desktop --project=mobile-320 --project=mobile-390

      - name: iPhone Safari active-session regression
        run: npx playwright test e2e/active-game-end.spec.ts e2e/play-amplified-category-images.spec.ts e2e/on-my-list-visual.spec.ts --project=mobile-safari-webkit

      - name: Upload browser-test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
